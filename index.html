<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d70f64">
<style>
:root{color-scheme:light;--bg:#fff;--panel:#fff;--soft:#fdeef4;--ink:#1f1f1f;--mute:#6b6b6b;--line:#e6e6e6;--acc:#d70f64;--btn:#d70f64;--btn-ink:#fff;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px;font-size:.92rem}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.tab .n{display:inline-block;min-width:1.6em;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--line);color:var(--ink);font-size:.8rem;text-align:center}
.bar{display:flex;flex-wrap:nowrap;gap:8px;margin:14px 0;align-items:stretch}
.bar input[type=search]{flex:1 1 0;min-width:0}
.bar .btn{white-space:nowrap;flex:0 0 auto;padding-left:12px;padding-right:12px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.btn{appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn.del{color:var(--danger);border-color:var(--line);background:transparent}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right}
td a{color:var(--ink)}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin:1px 3px 1px 0;font-size:.85rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.note{color:var(--mute);font-size:.85rem;margin-top:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(10,15,30,.55)}
dialog h2{margin:0 0 12px;font-size:1.15rem}
label{display:block;font-size:.88rem;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px;position:relative}
.top h1{margin:0}
.bar select{width:auto;flex:0 0 auto;max-width:42%;padding-left:8px;padding-right:6px}
.refresh{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.refresh:disabled{opacity:.6}
.menubtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.menu{position:absolute;top:46px;left:0;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:230px;padding:6px}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--soft)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Inventory</h1>
    <button class="btn ghost refresh" id="refresh" aria-label="Refresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span>Refresh</span></button>
  </div>
  <p class="sub">Manage your riders, vendors and customers in one place. Data is saved in this browser and synced to Google Sheets.</p>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="Search…" aria-label="Search">
    <select id="sort" aria-label="Sort"></select>
    <button class="btn" id="add">Add</button>
  </div>

  <div class="tablebox"><table id="tbl"></table></div>

  <p class="note" id="info"></p>
</div>

<dialog id="dlg">
  <h2 id="dtitle"></h2>
  <div id="fields"></div>
  <div class="row">
    <button class="btn ghost" id="dcancel">Cancel</button>
    <button class="btn" id="dsave">Save</button>
  </div>
</dialog>

<dialog id="txt">
  <h2>Copy your data</h2>
  <p class="note" style="margin-top:0">Saving a file is not available here. Copy the text below and paste it into your own file.</p>
  <textarea id="txtarea" rows="10" readonly></textarea>
  <div class="row"><button class="btn" id="txtclose">Close</button></div>
</dialog>

<div id="toast" role="status"></div>

<script>
const KEY='rider-manager-v1';
const CFG={
  riders:{label:'Riders',one:'rider',cols:[['id','Rider ID'],['name','Name'],['phone','Number'],['tags','Tags']]},
  vendors:{label:'Vendors',one:'vendor',cols:[['id','Vendor ID'],['name','Name'],['phone','Number'],['tags','Tags']]},
  customers:{label:'Customers',one:'customer',cols:[['name','Name'],['phone','Number'],['address','Address'],['tags','Tags']]}
};
let data={riders:[],vendors:[],customers:[]},tab='riders',q='',editing=null,dl=null;
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function load(){
  try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);for(const k in data)if(Array.isArray(d[k]))data[k]=d[k];}}catch(e){}
}
function save(){queuePush();
  try{localStorage.setItem(KEY,JSON.stringify(data));}
  catch(e){toast('Browser storage is blocked. Export a file to keep your data.');}
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tagify(s){return String(s||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean).map(x=>'<span class="tag">'+esc(x)+'</span>').join('');}

function render(){
  syncSort();
  $('#tabs').innerHTML=Object.keys(CFG).map(k=>'<button class="tab" role="tab" data-t="'+k+'" aria-selected="'+(k===tab)+'">'+CFG[k].label+'<span class="n">'+data[k].length+'</span></button>').join('');
  const c=CFG[tab].cols,needle=q.trim().toLowerCase();
  const rows=sortRows(data[tab].filter(r=>!needle||c.some(([k])=>String(r[k]||'').toLowerCase().includes(needle))));
  let h='<thead><tr>'+c.map(([,l])=>'<th>'+l+'</th>').join('')+'<th></th></tr></thead><tbody>';
  if(!rows.length)h+='<tr><td class="empty" colspan="'+(c.length+1)+'">'+(data[tab].length?'No matching records.':'No '+CFG[tab].label.toLowerCase()+' yet. Tap Add new or import a file.')+'</td></tr>';
  rows.forEach(r=>{
    h+='<tr>'+c.map(([k])=>{
      const v=r[k]||'';
      if(k==='phone')return '<td>'+(v?'<a href="tel:'+esc(v.replace(/[^\d+]/g,''))+'">'+esc(v)+'</a>':'')+'</td>';
      if(k==='tags')return '<td>'+tagify(v)+'</td>';
      return '<td>'+esc(v)+'</td>';
    }).join('')+'<td class="act"><button class="btn sm ghost" data-e="'+r._k+'">Edit</button> <button class="btn sm del" data-d="'+r._k+'">Delete</button></td></tr>';
  });
  $('#tbl').innerHTML=h+'</tbody>';
}

function openForm(key){
  editing=key;const c=CFG[tab].cols,r=key?data[tab].find(x=>x._k===key):{};
  $('#dtitle').textContent=(key?'Edit ':'Add ')+CFG[tab].one;
  $('#fields').innerHTML=c.map(([k,l])=>'<label for="f_'+k+'">'+l+'</label>'+(k==='address'?'<textarea id="f_'+k+'" rows="2">'+esc(r[k])+'</textarea>':'<input id="f_'+k+'" value="'+esc(r[k])+'"'+(k==='phone'?' inputmode="tel"':'')+'>')).join('');
  $('#dlg').showModal();
}
function saveForm(){
  const c=CFG[tab].cols,o={};c.forEach(([k])=>o[k]=$('#f_'+k).value.trim());
  if(!c.some(([k])=>o[k])){toast('Fill in at least one field.');return;}
  const dup=dupCheck(o);if(dup.length&&!confirm('Warning:\n'+dup.join('\n')+'\n\nSave anyway?'))return;
  if(editing){Object.assign(data[tab].find(x=>x._k===editing),o);}else{o._k=uid();data[tab].unshift(o);}
  $('#dlg').close();save();render();toast('Saved');
}

/* export / import */
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCsv(){const c=CFG[tab].cols;return '\ufeff'+[c.map(([,l])=>csvCell(l)).join(',')].concat(data[tab].map(r=>c.map(([k])=>csvCell(r[k])).join(','))).join('\r\n');}
function parseCsv(t){
  t=t.replace(/^\ufeff/,'');const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))out.push(row);row=[];}
    else f+=ch;}
  row.push(f);if(row.some(x=>x.trim()))out.push(row);return out;
}
async function saveFile(name,text){
  try{
    if(typeof claude==='undefined'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text]));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('File saved');return;}
    if(!dl)dl=await claude.use('downloads');
    if(dl){await dl.save({filename:name,data:text});toast('File saved');return;}
  }catch(e){if(e&&e.code==='declined')return;}
  $('#txtarea').value=text;$('#txt').showModal();
}
function merge(t,rows){
  const c=CFG[t].cols;let add=0;
  rows.forEach(r=>{
    const o={_k:uid()};c.forEach(([k])=>o[k]=String(r[k]==null?'':r[k]).trim());
    if(!c.some(([k])=>o[k]))return;
    if(data[t].some(x=>c.every(([k])=>(x[k]||'')===o[k])))return;
    data[t].push(o);add++;
  });
  return add;
}
function importText(name,text){
  try{
    if(/\.json$/i.test(name)||/^\s*[\{\[]/.test(text)){
      const d=JSON.parse(text);let n=0;
      if(Array.isArray(d))n=merge(tab,d);else for(const k in CFG)if(Array.isArray(d[k]))n+=merge(k,d[k]);
      save();render();toast(n+' records added');return;
    }
    const rows=parseCsv(text);if(rows.length<2){toast('The file is empty.');return;}
    const c=CFG[tab].cols,head=rows[0].map(x=>x.trim().toLowerCase());
    const idx=c.map(([k,l])=>{let i=head.indexOf(l.toLowerCase());if(i<0)i=head.indexOf(k);return i;});
    const useHead=idx.some(i=>i>=0);
    const objs=rows.slice(useHead?1:0).map(r=>{const o={};c.forEach(([k],j)=>o[k]=r[useHead?idx[j]:j]);return o;});
    const n=merge(tab,objs);save();render();toast(n+' records added');
  }catch(e){toast('Could not read the file. Check that it is a JSON or CSV file.');}
}

let sortBy='new';
function normNum(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='92'+d.slice(1);return d;}
function sortRows(rows){
  if(sortBy==='new')return rows;
  const key=sortBy==='id'?'id':'name',dir=sortBy==='name-desc'?-1:1;
  return rows.slice().sort((a,b)=>dir*String(a[key]||'').localeCompare(String(b[key]||''),undefined,{numeric:true,sensitivity:'base'}));
}
function syncSort(){
  const s=$('#sort'),hasId=CFG[tab].cols.some(([k])=>k==='id');
  if(s.dataset.id!==String(hasId)){
    if(!hasId&&sortBy==='id')sortBy='new';
    s.innerHTML='<option value="new">Newest</option><option value="name">Name A–Z</option><option value="name-desc">Name Z–A</option>'+(hasId?'<option value="id">ID</option>':'');
    s.dataset.id=String(hasId);
  }
  s.value=sortBy;
}
function dupCheck(o){
  const msgs=[],others=data[tab].filter(x=>x._k!==editing),label=CFG[tab].one;
  if(o.id){const d=others.find(x=>String(x.id||'').trim().toLowerCase()===o.id.toLowerCase());if(d)msgs.push('ID '+o.id+' is already used by another '+label+(d.name?' ('+d.name+')':'')+'.');}
  const n=normNum(o.phone);
  if(n){const d=others.find(x=>normNum(x.phone)===n);if(d)msgs.push('Number '+o.phone+' is already saved for another '+label+(d.name?' ('+d.name+')':'')+'.');}
  return msgs;
}

/* events */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;q='';$('#q').value='';render();}});
$('#q').addEventListener('input',e=>{q=e.target.value;render();});
$('#add').onclick=()=>openForm(null);
$('#dcancel').onclick=()=>$('#dlg').close();
$('#dsave').onclick=saveForm;
$('#fields').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')saveForm();});
$('#tbl').addEventListener('click',e=>{
  const ed=e.target.closest('[data-e]'),de=e.target.closest('[data-d]');
  if(ed)openForm(ed.dataset.e);
  if(de&&confirm('Delete this record?')){data[tab]=data[tab].filter(x=>x._k!==de.dataset.d);save();render();}
});
$('#txtclose').onclick=()=>$('#txt').close();


const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxb2xT9VwBGX2RpRx8mNGcLRls8SdxWqupx21rSn29yk27EOk5h8OO7L2B6L-W85X98xw/exec';
const CODE_KEY='rider-manager-code';
let pt=null,pushing=false,dirty=false;
function getCode(){
  let c='';try{c=localStorage.getItem(CODE_KEY)||'';}catch(e){}
  if(!c){c=(prompt('Enter the access code')||'').trim();try{localStorage.setItem(CODE_KEY,c);}catch(e){}}
  return c;
}
function badCode(){try{localStorage.removeItem(CODE_KEY);}catch(e){}setInfo('Wrong access code. Reload the page and enter it again.');}
function setInfo(m){$('#info').textContent=m;}
function queuePush(){dirty=true;setInfo('Syncing…');clearTimeout(pt);pt=setTimeout(push,800);}
async function push(){
  if(pushing){pt=setTimeout(push,800);return;}
  pushing=true;dirty=false;
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code:getCode(),data})});
    const j=await r.json();
    if(j.error){pushing=false;dirty=true;if(j.error==='denied')badCode();else setInfo('Sync failed.');return;}
    pushing=false;setInfo(dirty?'Syncing…':'Synced to Google Sheets at '+new Date().toLocaleTimeString());
  }catch(e){pushing=false;dirty=true;setInfo('Sync failed. Your data is safe in this browser and will sync on the next change.');toast('Sync failed');}
}
async function pull(){
  if(pushing||dirty)return;
  setInfo('Loading from Google Sheets…');
  try{
    const r=await fetch(SCRIPT_URL+'?code='+encodeURIComponent(getCode()));
    const d=await r.json();
    if(d.error){if(d.error==='denied')badCode();else setInfo('Could not read data from Google Sheets.');return;}
    const has=Object.keys(CFG).some(k=>d[k]&&d[k].length);
    if(has){for(const k in CFG)data[k]=d[k]||[];try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}render();setInfo('Synced from Google Sheets at '+new Date().toLocaleTimeString());}
    else if(Object.keys(CFG).some(k=>data[k].length))queuePush();
    else setInfo('Connected to Google Sheets. Nothing saved yet.');
  }catch(e){setInfo('Could not reach Google Sheets.');}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull();});

$('#sort').onchange=e=>{sortBy=e.target.value;render();};
$('#refresh').onclick=async()=>{const b=$('#refresh');b.disabled=true;clearTimeout(pt);if(dirty)await push();await pull();b.disabled=false;};

load();render();pull();
</script>
</body>
</html>
